# Prüft app/LeDoK.html bei jedem Push und jedem Pull Request:
# Skript lesbar, Version gültig, CHANGELOG-Eintrag vorhanden, wichtigste Abläufe im Browser (Playwright).
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: Electron wird für die Tests nicht gebraucht
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: testbericht
          path: playwright-report/
          retention-days: 14
