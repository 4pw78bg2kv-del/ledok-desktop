# Baut die LeDoK-Installer für Windows (.exe) und macOS (.dmg).
# Start: neuen Tag pushen (z. B. v1.1.0) oder manuell unter „Actions → Installer bauen → Run workflow“.
name: Installer bauen

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Build-Jobs führen fremden npm-Code aus und bekommen deshalb nur Leserechte;
# Schreibrechte (Release-Entwurf) hat nur der release-Job. Actions sind auf Commit-SHAs festgelegt.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ziel: win
          - os: macos-latest
            ziel: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:${{ matrix.ziel }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LeDoK-${{ matrix.ziel }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: dist/*
